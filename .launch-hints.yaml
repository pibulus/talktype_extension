# Launch hints for Launch Arsenal.
name: TalkType
slug: talktype-extension
app_type: chrome-extension
audience: people who talk faster than they type and are done with subscription dictation apps
problem: 'dictation tools are either locked to one app, cold and corporate, or a monthly bill for something your browser can do'
promise: Talk into any text box on the web. Cloud, live, or fully offline — your choice, your key, no account.
cta: Install it, click the ghost, say hello.
differentiators:
  - Four engines in one extension — Chrome built-in (zero setup), Gemini cloud, Deepgram live streaming, or Whisper running fully offline
  - No backend at all. Your key, stored locally, sent only to the provider you picked
  - Inserts at the cursor without overwriting what's there; works in Gmail, Notion, Slack, Discord, rich editors
  - Six personality styles — Surly Pirate, Quill & Ink, Code Whisperer…
proof_points:
  - Keyboard shortcut works on tabs that were open before install (injects on demand)
  - Private mode never sends audio anywhere; one ~96MB download then offline forever
  - Live mode signup includes ~$200 of Deepgram credit, roughly 400 hours of dictation
objections:
  - 'Bring-your-own-key is a hurdle for non-technical folks — Quick mode (Chrome built-in, zero setup) is the install default, so keys are opt-in'
keywords:
  seed:
    - TalkType
    - talktype extension
    - chrome extension voice to text
    - offline dictation chrome
  audience: people who talk faster than they type and want cleaner transcription
  intent:
    - dictate into gmail
    - voice typing chrome extension
    - offline speech to text browser
