<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TalkType needs your mic</title>
  <link rel="stylesheet" href="brand.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 340px; margin: 0; text-align: center; }
    .card img { width: 72px; height: 72px; margin-bottom: 6px; }
    ol { text-align: left; padding-left: 20px; margin: 10px 0 0; font-size: 13px; color: var(--ink-soft); }
    .btn-row { justify-content: center; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/ghost/ghost-128.png" alt="">
    <h2 style="justify-content: center;">One more thing: your mic</h2>
    <p id="permission-status">TalkType turns your voice into text. Chrome needs to hear you first.</p>
    <div class="btn-row">
      <button id="request" type="button">Allow microphone</button>
    </div>
    <div class="btn-row">
      <button id="settings" type="button" class="ghost">Open Chrome mic settings</button>
    </div>
  </div>
  <script src="permission-fix.js"></script>
</body>
</html>
