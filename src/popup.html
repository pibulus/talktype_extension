<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TalkType</title>
  <style>
    :root, html[data-vibe="peach"] { --accent: #ff5c9f; --accent-deep: #d73374; --accent-rgb: 255, 92, 159; --gradient: linear-gradient(135deg, #ff5c9f 0%, #ff8f70 55%, #f6b43d 100%); }
    html[data-vibe="mint"] { --accent: #2dd4bf; --accent-deep: #0f9e8a; --accent-rgb: 45, 212, 191; --gradient: linear-gradient(135deg, #2dd4bf 0%, #54d6bb 55%, #a7f3d0 100%); }
    html[data-vibe="bubblegum"] { --accent: #a855f7; --accent-deep: #7c3aed; --accent-rgb: 168, 85, 247; --gradient: linear-gradient(135deg, #c084fc 0%, #a855f7 55%, #7c3aed 100%); }
    :root {
      --ink: #17151f; --ink-soft: rgba(23, 21, 31, 0.68); --paper: #fff7e8; --card: #fffdf7;
      --line: 2.5px solid var(--ink); --shadow: 3px 3px 0 var(--ink);
    }

    html, body { width: 340px; margin: 0; padding: 0; }
    body {
      box-sizing: border-box; padding: 14px 16px 12px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 50% -20%, rgba(var(--accent-rgb), 0.18), transparent 50%), var(--paper);
      position: relative; overflow-x: hidden;
      animation: pop-in 0.2s cubic-bezier(0.23, 1, 0.32, 1);
    }
    @keyframes pop-in { from { opacity: 0.6; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

    .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
    .brand img { width: 34px; height: 34px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 800; white-space: nowrap; color: var(--ink);
      background: #fff; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
    }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #54d6bb; border: 1.5px solid var(--ink); }
    .status-pill.recording .dot { background: var(--accent); animation: blink 1s ease-in-out infinite; }
    .status-pill.processing .dot { background: #f6b43d; }
    .status-pill.error .dot { background: #ff5c78; }
    @keyframes blink { 50% { opacity: 0.3; } }

    .divider { height: 2.5px; background: var(--ink); border-radius: 2px; margin-bottom: 12px; opacity: 0.9; }

    .card {
      background: var(--card); border: var(--line); border-radius: 14px; box-shadow: var(--shadow);
      padding: 12px 14px; margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 4px; font-size: 15px; font-weight: 900; }
    .card p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.45; color: var(--ink-soft); }
    .kicker { font-size: 10.5px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }

    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font: inherit; font-size: 15px; font-weight: 900; letter-spacing: 0.1px; color: var(--ink); cursor: pointer;
      background: var(--gradient); border: var(--line); border-radius: 14px;
      min-height: 50px; padding: 10px 14px; width: 100%; box-shadow: var(--shadow);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: var(--shadow); }
    button.secondary { background: #fff; }
    button.stop { background: var(--ink); color: #fff; }
    button .icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .row { display: flex; gap: 8px; }

    .target { margin: 10px 2px 12px; font-size: 12px; color: var(--ink-soft); display: flex; align-items: flex-start; gap: 6px; min-height: 16px; font-weight: 500; }
    .target b { color: var(--ink); font-weight: 800; }
    .target .arrow { color: var(--accent-deep); font-weight: 900; }

    .listening { display: none; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 10px; }
    .listening.show { display: flex; }
    .listening .bar { width: 6px; border-radius: 3px; background: var(--accent); border: 1.5px solid var(--ink); animation: wave 0.9s ease-in-out infinite; height: 14px; }
    .listening .bar:nth-child(2) { animation-delay: 0.12s; } .listening .bar:nth-child(3) { animation-delay: 0.24s; }
    .listening .bar:nth-child(4) { animation-delay: 0.36s; } .listening .bar:nth-child(5) { animation-delay: 0.48s; }
    @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 26px; } }
    .listening .timer { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 13px; color: var(--ink); margin-left: 8px; }

    #result { display: none; }
    #result-text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 190px; overflow-y: auto; padding-right: 6px;
      scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
    .result-actions { display: flex; gap: 8px; margin-top: 10px; }
    .result-actions button { min-height: 34px; padding: 4px 10px; font-size: 12px; width: auto; flex: 1; border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); }

    #history { display: none; }
    .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .history-head button { width: auto; min-height: 0; padding: 3px 8px; font-size: 11px; color: var(--accent-deep); background: transparent; border: none; box-shadow: none; }
    .history-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink);
      background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 0; box-shadow: 2px 2px 0 var(--ink); }
    .history-item:hover { background: rgba(var(--accent-rgb), 0.14); }
    .history-item .host { color: var(--ink-soft); font-size: 10px; margin-right: 6px; }

    .footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; color: var(--ink);
      background: #fff; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; white-space: nowrap; transition: transform 0.1s, box-shadow 0.1s; }
    .chip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
    .chip kbd { font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .chip.warn { background: rgba(246, 180, 61, 0.4); }
    .chips { display: flex; gap: 8px; min-width: 0; overflow: hidden; }

    .error-line { font-size: 12.5px; color: #c81558; font-weight: 700; margin: 6px 2px 8px; }

    .toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-20px); padding: 7px 14px; border-radius: 999px;
      font-size: 12.5px; font-weight: 900; color: var(--ink); background: #54d6bb; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    :focus:not(:focus-visible) { outline: none; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand"><img src="icons/ghost/ghost-128.png" alt="" id="brand-ghost"><span>TalkType</span></div>
    <div id="status" class="status-pill ready" role="status"><span class="dot"></span><span id="status-text">Ready</span></div>
  </div>
  <div class="divider"></div>

  <div id="setup" class="card" style="display: none;" role="region" aria-label="Setup">
    <div class="kicker">One more step</div>
    <h2 id="setup-title">TalkType needs a key</h2>
    <p id="setup-text">Pick an engine and plug in a key. Takes a minute.</p>
    <div class="row">
      <button id="setup-open" type="button">Finish setup</button>
      <button id="setup-key" type="button" class="secondary">Get a key ↗</button>
    </div>
  </div>

  <div id="listening" class="listening" aria-hidden="true">
    <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    <span class="timer" id="timer">0:00</span>
  </div>

  <button id="record" type="button">
    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="currentColor" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"></path>
    </svg>
    <span id="record-label">Start talking</span>
  </button>
  <div id="target" class="target"></div>
  <div id="error" class="error-line" style="display: none;"></div>

  <div id="result" class="card">
    <div class="kicker">Transcript</div>
    <div id="result-text"></div>
    <div class="result-actions">
      <button id="copy" type="button" class="secondary">Copy</button>
      <button id="insert" type="button" class="secondary" style="display: none;">Insert into page</button>
    </div>
  </div>

  <div id="history" class="card">
    <div class="history-head"><span class="kicker" style="margin: 0;">Recent</span><button id="clear-history" type="button">Clear</button></div>
    <div id="history-list"></div>
  </div>

  <div class="footer">
    <div class="chips">
      <span id="engine-chip" class="chip" title="Change engine">☁️ Cloud</span>
      <span id="shortcut-chip" class="chip" title="Change shortcut"><kbd>…</kbd></span>
    </div>
    <span id="open-options" class="chip" title="Settings">⚙ Settings</span>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="storage-service.js"></script>
  <script src="sound-service.js"></script>
  <script src="api-service.js"></script>
  <script src="audio-service.js"></script>
  <script src="popup.js"></script>
</body>
</html>
